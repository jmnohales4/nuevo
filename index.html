<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --food: #ef4444;
    --grid: #334155;
    --text: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 1.8rem;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .scoreboard {
    display: flex;
    gap: 24px;
    font-size: 1.1rem;
  }
  .scoreboard span { color: var(--accent); font-weight: 700; }
  .wrap {
    position: relative;
  }
  canvas {
    background: var(--panel);
    border: 2px solid var(--grid);
    border-radius: 8px;
    display: block;
    max-width: 90vw;
    max-height: 70vh;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; }
  button {
    background: var(--accent);
    color: #04210f;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  .hint { font-size: 0.85rem; color: #94a3b8; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="scoreboard">
    <div>Puntos: <span id="score">0</span></div>
    <div>Récord: <span id="best">0</span></div>
  </div>

  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p class="hint" id="overlay-hint">Usa las flechas, WASD o desliza para moverte.</p>
      <button id="start-btn">Jugar</button>
    </div>
  </div>
  <p class="hint">Flechas / WASD en escritorio · Deslizar en móvil · Espacio para pausar</p>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayHint = document.getElementById("overlay-hint");
  const startBtn = document.getElementById("start-btn");

  // Grid configuration: the board is a grid of cells.
  const CELLS = 20;                       // cells per side
  const CELL = canvas.width / CELLS;      // pixel size of one cell
  const START_SPEED = 140;                // ms per step (lower = faster)
  const MIN_SPEED = 70;                   // fastest the snake can get

  let snake, direction, nextDirection, food, score, speed;
  let loopId = null;
  let running = false;

  const best = { value: Number(localStorage.getItem("snake-best") || 0) };
  bestEl.textContent = best.value;

  // Set up a fresh game state.
  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    direction = { x: 1, y: 0 };   // moving right
    nextDirection = direction;
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = score;
    placeFood();
  }

  // Put food on a random free cell (not on the snake).
  function placeFood() {
    while (true) {
      const spot = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
      const onSnake = snake.some((s) => s.x === spot.x && s.y === spot.y);
      if (!onSnake) { food = spot; return; }
    }
  }

  // Advance the game one step.
  function step() {
    direction = nextDirection;
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    // Collision with walls ends the game.
    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return gameOver();
    }
    // Collision with itself ends the game.
    if (snake.some((s) => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      // Eat: grow (don't pop tail), score up, speed up a little.
      score += 1;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      placeFood();
      restartLoop();
    } else {
      snake.pop();   // move forward: drop the tail
    }

    draw();
  }

  // Draw everything.
  function draw() {
    ctx.fillStyle = getCss("--panel");
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = getCss("--grid");
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = getCss("--food");
    roundRect(food.x * CELL, food.y * CELL, CELL, CELL, 5);

    // snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? getCss("--accent") : getCss("--accent-dark");
      roundRect(seg.x * CELL, seg.y * CELL, CELL, CELL, 4);
    });
  }

  function roundRect(x, y, w, h, r) {
    const p = 1; // small padding between cells
    ctx.beginPath();
    ctx.roundRect(x + p, y + p, w - 2 * p, h - 2 * p, r);
    ctx.fill();
  }

  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function restartLoop() {
    if (loopId) clearInterval(loopId);
    loopId = setInterval(step, speed);
  }

  function start() {
    reset();
    draw();
    overlay.classList.add("hidden");
    running = true;
    restartLoop();
  }

  function gameOver() {
    running = false;
    if (loopId) clearInterval(loopId);
    loopId = null;
    if (score > best.value) {
      best.value = score;
      localStorage.setItem("snake-best", String(score));
      bestEl.textContent = score;
    }
    overlayTitle.textContent = "¡Game Over!";
    overlayHint.textContent = "Puntuación: " + score + ". Pulsa para jugar de nuevo.";
    startBtn.textContent = "Reintentar";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running && loopId === null && overlay.classList.contains("hidden")) {
      // resume
      running = true;
      restartLoop();
    } else if (running) {
      running = false;
      clearInterval(loopId);
      loopId = null;
    }
  }

  // Change direction, preventing 180° reversals.
  function setDirection(x, y) {
    if (!running) return;
    if (x === -direction.x && y === -direction.y) return; // no reverse
    nextDirection = { x, y };
  }

  // Keyboard controls.
  document.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": setDirection(0, -1); e.preventDefault(); break;
      case "ArrowDown": case "s": case "S": setDirection(0, 1); e.preventDefault(); break;
      case "ArrowLeft": case "a": case "A": setDirection(-1, 0); e.preventDefault(); break;
      case "ArrowRight": case "d": case "D": setDirection(1, 0); e.preventDefault(); break;
      case " ": if (overlay.classList.contains("hidden")) togglePause(); e.preventDefault(); break;
    }
  });

  // Touch / swipe controls.
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // ignore taps
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener("click", start);

  // Initial render behind the overlay.
  reset();
  draw();
})();
</script>
</body>
</html>
